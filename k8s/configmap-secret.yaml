apiVersion: v1
kind: ConfigMap
metadata:
  name: veritas-pay-config
  namespace: veritas-pay
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/veritas_pay"
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
---
apiVersion: v1
kind: Secret
metadata:
  name: veritas-pay-secrets
  namespace: veritas-pay
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "veritas"
  SPRING_DATASOURCE_PASSWORD: "replace-with-external-secret"
  APP_JWT_SECRET: "replace-with-256bit-kms-managed-jwt-secret"
