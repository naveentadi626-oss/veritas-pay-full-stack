name: VeritasPay CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  backend-ci:
    name: Backend Build, Unit & Testcontainers Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Unit & Integration Tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/*-reports/

  frontend-ci:
    name: Frontend Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest suite
        working-directory: frontend
        run: npm test -- --run

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  container-security:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t veritas-pay-backend:${{ github.sha }} ./backend

      - name: Build Frontend Docker Image
        run: docker build -t veritas-pay-frontend:${{ github.sha }} ./frontend

      - name: Run Trivy scan on backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: veritas-pay-backend:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
